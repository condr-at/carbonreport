services:
  postgres:
    image: postgres:16-alpine
    container_name: carbonreport-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: carbonreport
      POSTGRES_PASSWORD: carbonreport_dev
      POSTGRES_DB: carbonreport
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carbonreport"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: carbonreport_postgres_data
